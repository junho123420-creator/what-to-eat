# 오늘 뭐 먹지? Web 서버(Nginx). 설치: sudo bash deploy/install-web.sh
# React 빌드 결과(/var/www/what-to-eat)를 8080에서 제공하고, /api/ 요청만 App 서버(FastAPI, 8010)로 넘긴다.
# flow-task 사이트(80)와 포트가 달라 함께 실행된다. App 서버를 분리하면 proxy_pass 주소만 바꾼다.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/what-to-eat;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일 이름에 내용 해시가 들어가므로 오래 캐시해도 된다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
