# 오늘 뭐 먹지? Web 서버(Nginx). 설치: sudo bash deploy/install-web.sh
# React 빌드 결과(/var/www/what-to-eat)를 제공하고, /api/ 요청만 App 서버(FastAPI, 8010)로 넘긴다.
# 접속 주소: http://localhost:8080 또는 포트 없이 http://eat.localhost
#   80번은 flow-task 사이트(default_server)가 쓰므로, 80번에서는 주소 이름이 eat.localhost일 때만 이 사이트가 받는다.
#   크롬 등은 *.localhost를 자동으로 내 컴퓨터(127.0.0.1)로 보내므로 hosts 파일을 고칠 필요가 없다.
# App 서버를 분리하면 proxy_pass 주소만 바꾼다.
server {
    listen 8080;
    listen [::]:8080;
    listen 80;
    listen [::]:80;
    server_name eat.localhost;

    root /var/www/what-to-eat;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일 이름에 내용 해시가 들어가므로 오래 캐시해도 된다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
