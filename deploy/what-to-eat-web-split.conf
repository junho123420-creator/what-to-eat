# 오늘 뭐 먹지? Web 서버(Nginx), 서버 3대로 분리한 배포(R27). 설치: Web 서버에서 sudo WEB_MODE=split bash deploy/install-web.sh
# Web 10.10.10.10(공개 주소 52.79.221.146) → App 10.10.20.20:8010 → DB 10.10.30.30:3306
# 이 서버는 이 사이트 전용이라 80번 기본 사이트로 받는다. 접속 주소: http://52.79.221.146
# React 빌드 결과(/var/www/what-to-eat)를 제공하고, /api/ 요청만 App 서버로 넘긴다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/what-to-eat;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 파일 이름에 내용 해시가 들어가므로 오래 캐시해도 된다.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://10.10.20.20:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
